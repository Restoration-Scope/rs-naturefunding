<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(http://localhost:4330/fonts/switzer-variable.woff2);font-weight:100 900}
@font-face{font-family:S;src:url(http://localhost:4330/fonts/geist-serif-regular.woff2);font-weight:400}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:oklch(0.31 0.055 172);color:oklch(0.97 0.012 165);font-family:A;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px;box-sizing:border-box}
.wm{display:flex;align-items:center;gap:12px;font-family:S;font-weight:400;font-size:38px}.wm span{color:oklch(0.84 0.03 165)}
h1{margin:0;font-family:S;font-size:68px;line-height:1.05;font-weight:400;letter-spacing:-.01em;max-width:980px}
.row{display:flex;align-items:center;gap:18px}
.tape{display:inline-flex;align-items:center;height:46px;padding:0 30px 0 18px;font-weight:700;font-size:24px;color:oklch(0.22 0.03 180);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%)}
.tag{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 12px;background:oklch(0.905 0.008 220);border:2px solid oklch(0.78 0.012 220);border-radius:5px;color:oklch(0.32 0.02 220);font-family:A;font-weight:600;font-size:21px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.tag:before{content:"";width:14px;height:14px;border-radius:50%;background:oklch(0.31 0.055 172);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
</style></head><body>
<div class="wm"><svg viewBox="0 0 24 24" width="38" height="38" style="color:oklch(0.86 0.2 138)"><path d="M12 2.5c-4.6 3.4-7 7-7 10.6a7 7 0 0 0 14 0c0-3.6-2.4-7.2-7-10.6Z" fill="currentColor" opacity=".22"/><path d="M12 21.5V9.5m0 4.5 3.2-2.6M12 17l-3.4-2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>naturefunding<span>.org</span></div>
<h1>Funding for nature restoration, checked against each funder’s own page.</h1>
<div class="row"><span class="tape" style="background:oklch(0.86 0.2 138)">Open</span><span class="tape" style="background:oklch(0.82 0.11 230)">Rolling</span><span class="tape" style="background:oklch(0.82 0.15 62)">Upcoming</span><span style="flex:1"></span><span class="tag">Checked against the funder’s page</span></div>
