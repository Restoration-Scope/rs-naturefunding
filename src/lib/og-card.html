<!doctype html><html><head><meta charset="utf-8"><style>
/* public/og.png, 1200x630: the home band as a card. Render with the dev server on :4332 for the fonts and image. */
@font-face{font-family:A;src:url(http://localhost:4332/fonts/inter-latin-variable.woff2);font-weight:100 900}
@font-face{font-family:S;src:url(http://localhost:4332/fonts/geist-serif-regular.woff2);font-weight:400}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#254b36;color:#f7f4ef;font-family:A;box-sizing:border-box}
.art{position:absolute;inset:0 0 0 660px}
.art img{width:100%;height:100%;object-fit:cover;object-position:20% 100%;display:block}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#254b36,rgb(37 75 54/.5) 90px,rgb(37 75 54/0) 220px)}
.text{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100%;width:680px;padding:60px 0 64px 72px;box-sizing:border-box}
.wm{display:flex;align-items:center;gap:12px;white-space:nowrap;font-family:S;font-size:36px}.wm span{color:#beccc2}
h1{margin:0;font-family:S;font-size:58px;line-height:1.1;font-weight:400;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px}
.status{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 13px;border-radius:8px;font-weight:500;font-size:23px}
.status:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dot)}
</style></head><body>
<div class="art"><img src="http://localhost:4332/img/header/hero-1236.jpg" alt=""></div>
<div class="text">
<div class="wm"><svg viewBox="0 0 24 24" width="36" height="36"><path d="M12 2.5c-4.6 3.4-7 7-7 10.6a7 7 0 0 0 14 0c0-3.6-2.4-7.2-7-10.6Z" fill="#beccc2"/><path d="M12 21.5V9.5m0 4.5 3.2-2.6M12 17l-3.4-2.8" fill="none" stroke="#254b36" stroke-width="1.8" stroke-linecap="round"/></svg><b style="font-weight:400">naturefunding<span>.org</span></b></div>
<h1>Funding for nature restoration and conservation, checked against each funder’s own page.</h1>
<div class="row"><span class="status" style="--dot:#3a7e49;background:#e3ede6;color:#254b36">Open</span><span class="status" style="--dot:#3e58eb;background:#e8ebfd;color:#2b3d7c">Rolling</span><span class="status" style="--dot:#a45435;background:#f2e7e3;color:#66402c">Upcoming</span></div>
</div>
</body></html>
