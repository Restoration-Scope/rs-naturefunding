name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Refresh PRs are opened with the workflow token, which triggers no workflow; the refresh job dispatches this instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Astro checks the Node version even under Bun; the runner's preinstalled Node can lag behind.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Types (astro check)
        run: bun run check
      - name: Data (schema, ids, watch list)
        run: bun run validate
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
