name: Refresh

# Daily: re-read every due funder page. Tier A (unchanged, quotes present, deadlines passed)
# commits to main; Tier B (changed page or gone quote) opens a PR for review. New NbS calls from
# the EU and grants.gov APIs go into one review issue (scripts/refresh/discover.ts).
# Weekly: link-rot pass, a summary issue, and funders found by web search (Exa) not yet listed,
# raised as one review issue (scripts/refresh/discover-web.ts).
on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, weekly]
        default: daily
      only:
        description: Comma-separated source ids to read (default every due source)
        default: ''
      simulate:
        description: 'Proof only: changed:<source-id>,blocked:<source-id>'
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: c72792497a89bc5db0c41066540d52ea
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_EXTRACTOR: ${{ vars.LLM_EXTRACTOR }}
      LLM_REVIEWER: ${{ vars.LLM_REVIEWER }}
      MODE: ${{ inputs.mode || (github.event.schedule == '43 6 * * 1' && 'weekly') || 'daily' }}
    steps:
      - uses: actions/checkout@v7
      # Astro checks the Node version even under Bun; the runner's preinstalled Node can lag behind.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      # pdftotext for PDF call documents, tesseract for their image pages and LibreOffice for old Word files
      # (scripts/data/pdf.ts, convert.ts), so quotes check here as they did when read.
      - name: PDF, OCR and document readers
        # pdftotext is required; without the OCR and conversion tools, image pages and old Word files report what they need.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-script-latn tesseract-ocr-script-jpan tesseract-ocr-script-hans tesseract-ocr-script-hant tesseract-ocr-script-hang tesseract-ocr-script-cyrl tesseract-ocr-script-grek libreoffice-writer-nogui || echo "::warning::OCR or document converters did not install"
          command -v tesseract && tesseract --list-langs; command -v soffice || true
      # OCR answers are keyed by the file's bytes and the tesseract version, so a rerun on unchanged PDFs is free.
      - uses: actions/cache@v4
        with:
          path: .cache/ocr
          key: ocr-${{ github.run_id }}
          restore-keys: ocr-
      - name: Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # run.ts stops drafting changed pages 50 minutes in (TIER_B_DEADLINE_MINUTES). This step
      # timeout is the backstop: a timed-out step fails without cancelling the job, so the commit
      # step below still saves the unchanged pages' dates, which run.ts writes before any model call.
      - name: Read pages
        if: env.MODE == 'daily'
        timeout-minutes: 62
        env:
          ONLY: ${{ inputs.only }}
          SIMULATE: ${{ inputs.simulate }}
          # One token for deploy and for the models that re-read changed pages (Workers AI Read); only this step sees it.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/refresh/run.ts ${ONLY:+--only "$ONLY"} ${SIMULATE:+--simulate "$SIMULATE"}

      # Today's exchange rates for the worth-it check and amount sorting (data/rates.json). If the feed
      # is down, yesterday's snapshot stays and the site shows its date.
      - name: Exchange rates
        if: env.MODE == 'daily'
        continue-on-error: true
        run: bun run sync-rates

      # New NbS calls from the EU Funding & Tenders and grants.gov APIs, raised as one review issue.
      - name: Discover new calls
        if: env.MODE == 'daily'
        continue-on-error: true
        env:
          EU_SEARCH_API_KEY: ${{ secrets.EU_SEARCH_API_KEY }}
        run: bun scripts/refresh/discover.ts

      - name: Link rot and weekly summary
        if: env.MODE == 'weekly'
        run: bun scripts/refresh/weekly.ts

      # Funders found by web search (Exa, about $0.50 a run) that we don't list, raised as one review issue.
      - name: Discover funders on the web
        if: env.MODE == 'weekly'
        continue-on-error: true
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: bun scripts/refresh/discover-web.ts

      # Calls on curated directories (tips only: title and link) whose funder page we don't cite, raised as one review issue.
      - name: Discover calls on directories
        if: env.MODE == 'weekly'
        continue-on-error: true
        run: bun scripts/refresh/discover-directories.ts

      - name: Commit Tier A to the branch (main on schedule)
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add data/
          if git diff --cached --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh $(date -u +%F) ($MODE): checked dates and page state" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cleanup_git_state() {
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git cherry-pick --abort 2>/dev/null || true
          }
          # A line-by-line merge of a programme file that a PR changed during the run can mix the two
          # versions into one that fails validation (20 Nov: dates from the run, facts from the PR).
          # Then keep the PR's version of every programme file it changed; they get new dates when next due.
          valid_or_upstream() {
            bun run validate >/dev/null 2>&1 && return 0
            upstream="origin/$GITHUB_REF_NAME"
            changed=$(git diff --name-only --diff-filter=d "$GITHUB_SHA" "$upstream" -- data/programmes)
            deleted=$(git diff --name-only --diff-filter=D "$GITHUB_SHA" "$upstream" -- data/programmes)
            [ -n "$changed" ] && git checkout "$upstream" -- $changed
            [ -n "$deleted" ] && git rm -q --ignore-unmatch -- $deleted
            # A draft committed by the run also accepted its page: undo that too, so the page is drafted again.
            for f in $changed $deleted; do
              for sid in $(jq -r --arg p "$(basename "$f" .json)" '.[] | select(.programme_id == $p) | .id' data/sources.json); do
                a="data/checks/accepted/$sid.json"
                git checkout "$upstream" -- "$a" 2>/dev/null || git rm -q --ignore-unmatch -- "$a"
              done
            done
            git commit -q -m "Refresh: keep the version of programmes changed during the run" || true
            bun run validate
          }

          for _ in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && valid_or_upstream && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi

            cleanup_git_state
            git fetch origin "$GITHUB_REF_NAME"
            if git merge --no-edit -X theirs "origin/$GITHUB_REF_NAME" && valid_or_upstream && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi

            cleanup_git_state
            sleep 5
          done
          cleanup_git_state
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "::error::could not push the refresh commit"; exit 1

      - name: Open Tier B pull requests
        if: ${{ !cancelled() && env.MODE == 'daily' }}
        run: bun scripts/refresh/open-prs.ts

      # Pushes made with the workflow token trigger no workflow, so deploy is started by hand.
      - name: Deploy the refreshed data
        if: ${{ !cancelled() && steps.commit.outputs.pushed == 'true' && github.ref_name == 'main' }}
        run: gh workflow run deploy.yml --ref main
