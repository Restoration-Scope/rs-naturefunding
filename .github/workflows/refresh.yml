name: Refresh

# Daily: re-read every due funder page. Tier A (unchanged, quotes present, deadlines passed)
# commits to main; Tier B (changed page or gone quote) opens a PR for review.
# Weekly: link-rot pass and a summary issue.
on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, weekly]
        default: daily
      only:
        description: Comma-separated source ids to read (default every due source)
        default: ''
      simulate:
        description: 'Proof only: changed:<source-id>,blocked:<source-id>'
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  models: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c72792497a89bc5db0c41066540d52ea
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_EXTRACTOR: ${{ vars.LLM_EXTRACTOR }}
      LLM_REVIEWER: ${{ vars.LLM_REVIEWER }}
      MODE: ${{ inputs.mode || (github.event.schedule == '43 6 * * 1' && 'weekly') || 'daily' }}
    steps:
      - uses: actions/checkout@v7
      # Astro checks the Node version even under Bun; the runner's preinstalled Node can lag behind.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: pdftotext for PDF call documents
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Read pages
        if: env.MODE == 'daily'
        env:
          ONLY: ${{ inputs.only }}
          SIMULATE: ${{ inputs.simulate }}
        run: bun scripts/refresh/run.ts ${ONLY:+--only "$ONLY"} ${SIMULATE:+--simulate "$SIMULATE"}

      - name: Link rot and weekly summary
        if: env.MODE == 'weekly'
        run: bun scripts/refresh/weekly.ts

      - name: Commit Tier A to the branch (main on schedule)
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add data/
          if git diff --cached --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh $(date -u +%F) ($MODE): checked dates and page state" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for _ in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "::error::could not push the refresh commit"; exit 1

      - name: Open Tier B pull requests
        if: ${{ !cancelled() && env.MODE == 'daily' }}
        run: bun scripts/refresh/open-prs.ts

      # Pushes made with the workflow token trigger no workflow, so deploy is started by hand.
      - name: Deploy the refreshed data
        if: ${{ !cancelled() && steps.commit.outputs.pushed == 'true' && github.ref_name == 'main' }}
        run: gh workflow run deploy.yml --ref main
