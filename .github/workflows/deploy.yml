name: Deploy

# Builds the static site and uploads it as Cloudflare static assets (no Worker script).
# Needs CLOUDFLARE_API_TOKEN: Workers Scripts edit on the account in wrangler.jsonc.
on:
  push:
    branches: [main]
  # The refresh job starts this after its own commits, which trigger no push event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run build
      - name: No token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; built but not deployed."
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler deploy
