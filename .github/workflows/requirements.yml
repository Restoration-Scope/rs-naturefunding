name: Requirements

# Reads programmes' requirements (scripts/requirements/run.ts) where the model keys live. Push a branch
# named requirements-run/<anything> whose .requirements-run file holds the arguments (for example
# "--gold all --dry" or "--queue 30"). The run folder, and a patch of any data it wrote, come back as an
# artifact; a person or agent applies the patch, runs the gates and opens the PR. Nothing is committed here.
on:
  push:
    branches: ['requirements-run/**']
  workflow_dispatch:
    inputs:
      args:
        description: Arguments for scripts/requirements/run.ts
        required: true

permissions:
  contents: read

concurrency:
  group: requirements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # pdftotext for PDFs, tesseract for their image pages, LibreOffice for old Word, OpenDocument and RTF files (scripts/data/pdf.ts, convert.ts).
      - name: PDF, OCR and document readers
        # pdftotext is required; without the OCR and conversion tools, image pages and old Word files report what they need.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-script-latn tesseract-ocr-script-jpan tesseract-ocr-script-hans tesseract-ocr-script-hant tesseract-ocr-script-hang tesseract-ocr-script-cyrl tesseract-ocr-script-grek libreoffice-writer-nogui || echo "::warning::OCR or document converters did not install"
          command -v tesseract && tesseract --list-langs; command -v soffice || true
      # OCR answers are keyed by the file's bytes and the tesseract version, so a rerun on unchanged PDFs is free.
      - uses: actions/cache@v4
        with:
          path: .cache/ocr
          key: ocr-${{ github.run_id }}
          restore-keys: ocr-
      # Model answers are cached by model, prompt version and input, so a rerun on unchanged pages is free.
      - uses: actions/cache@v4
        with:
          path: .cache/requirements/llm
          key: requirements-llm-${{ github.run_id }}
          restore-keys: requirements-llm-
      - name: Read requirements
        env:
          ARGS: ${{ inputs.args }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: c72792497a89bc5db0c41066540d52ea
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          args="${ARGS:-$(cat .requirements-run)}"
          echo "args: $args"
          bun scripts/requirements/run.ts $args --out run
      - name: Score against the gold set
        if: always()
        run: |
          [ -f run/report.json ] || exit 0
          for split in tune held all; do bun scripts/requirements/eval.ts run --split $split > /dev/null || true; done
      - name: Patch of written data
        if: always()
        run: git add -N data && git diff --binary -- data > run/data.patch || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-run
          path: run
          retention-days: 30
